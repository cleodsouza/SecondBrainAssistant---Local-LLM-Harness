# Phase 1 baseline: pilot model, prompt-only JSON, temperature 0.
# Start the server first, from D:\SLM Project:
#   llama-bin/llama-server.exe -hf unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M -ngl 99 -c 8192 --port 8080 --seed 42
name: phase1_qwen3-4b-instruct_q4km
model_label: qwen3-4b-instruct-2507
quant: Q4_K_M
server: http://127.0.0.1:8080
corpus_dir: second_brain_corpus/build
tracks: [A, B]
repeats: 5
warmup: 3
order_seed: 1234
enforcement: prompt_only

# Set every sampling knob explicitly so results never depend on server defaults.
sampling:
  temperature: 0.0
  seed: 42
  top_k: 40
  top_p: 0.95
  min_p: 0.05
  repeat_penalty: 1.0
  n_predict: 512

# Phase 2 will put json_schema / grammar here; leave empty for Phase 1.
extra_params: {}

# Record conditions you can't measure from code:
conditions: "plugged in, Windows power mode = Best performance, browser closed"
